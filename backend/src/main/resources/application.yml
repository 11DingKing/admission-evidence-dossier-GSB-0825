spring:
  application:
    name: admission-evidence-dossier
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admission_dossier}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
